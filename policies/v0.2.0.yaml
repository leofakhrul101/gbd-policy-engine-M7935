# policies/v0.2.0.yaml — v0.2 bundle. Same nine rules as 0.1.0; adds
# required_signals (safe state, AI Act Art 14(4)(e) / recital 73) and the
# controller approval block (EDPB Guidelines 07/2020 paras 84, 116, 118).
# A policy version is now itself evidence of controller sign-off.

policy_version: 0.2.0
effective_date: '2026-08-22'
description: 'v0.2: adds required-signal safe state (AI Act Art 14(4)(e)), controller
  approval block (EDPB 07/2020 para 84), notice-triggered re-entry support; rules
  unchanged from 0.1.0.'
oversight_pathway: internal-complaint-v1
# The same route, in words the affected artist can act on. DSA Art 17(4) requires the
# statement to be 'clear and easily comprehensible'; a scheme identifier is neither.
oversight_pathway_label: "the 'Query this decision' link on the release in your dashboard"
retention_reference: 'retention-policy-v1 (synthetic demo: indefinite)'
bands:
  high: 0.8
  medium: 0.5
  low: 0.2
outcomes:
  reject: 0.8
  quarantine: 0.5
  review: 0.3
adverse_outcomes:
- REVIEW
- QUARANTINE
- REJECT
gated_outcomes:
- REVIEW
rules:
- rule_id: RULE_OWNERSHIP_CONFLICT
  norm_refs:
  - GDPR_22
  - DSA_17
  articles:
  - GDPR Art 22
  - DSA Art 17(3)(b)
  obligation: Contested ownership makes the decision significant for the affected
    artist; Art 22 safeguards and Art 17 facts-relied-on apply.
  control_objective: Never let a contested-ownership submission pass on automation
    alone.
  system_rule: If more than one ownership claimant is present, add risk weight 0.35
    and force human review.
  evidence_output: triggered_rules entry; human-review routing recorded; claimant
    count as category (no identities).
  condition:
    type: input
    field: ownership_claims
    op: count_gt
    value: 1
  confidence_weight: 0.35
  forces_human_review: true
  reason_code: OWNERSHIP_CONFLICT
  description: Conflicting ownership claims detected on submitted recording.
- rule_id: RULE_FINGERPRINT_PARTIAL
  norm_refs:
  - DSA_17
  - DSA_14
  articles:
  - DSA Art 17(3)(b)
  - DSA Art 14
  obligation: Facts relied on must be recorded (17(3)(b)); T&C restrictions applied
    diligently and objectively (14).
  control_objective: Ambiguous fingerprint evidence must lower assessment confidence,
    not silently resolve.
  system_rule: If 0.30 <= fingerprint_match_score < 0.75, add risk weight 0.25.
  evidence_output: triggered_rules entry; 'fingerprint_match_partial' category in
    facts relied on.
  condition:
    type: input
    field: fingerprint_match_score
    op: between
    value:
    - 0.3
    - 0.75
  confidence_weight: 0.25
  reason_code: FINGERPRINT_PARTIAL
  description: Partial acoustic fingerprint match against an existing recording.
- rule_id: RULE_FINGERPRINT_STRONG
  norm_refs:
  - DSA_17
  - DSA_14
  articles:
  - DSA Art 17(3)(b)
  - DSA Art 14
  obligation: Facts relied on must be recorded (17(3)(b)); a strong match is a fact
    that must be stated, not a verdict of infringement.
  control_objective: Strong duplication evidence raises confident concern while remaining
    evidence, not adjudication.
  system_rule: If fingerprint_match_score >= 0.75, add risk weight 0.55.
  evidence_output: triggered_rules entry; 'fingerprint_match_strong' category in facts
    relied on.
  condition:
    type: input
    field: fingerprint_match_score
    op: gte
    value: 0.75
  confidence_weight: 0.55
  reason_code: FINGERPRINT_STRONG
  description: Strong acoustic fingerprint match against an existing recording.
- rule_id: RULE_NEW_ACCOUNT
  norm_refs:
  - DSA_14
  articles:
  - DSA Art 14
  obligation: Behavioural criteria used to restrict must be declared in T&Cs and applied
    objectively.
  control_objective: Account-age signal contributes transparently and proportionately,
    never decisively.
  system_rule: If account_age_days < 30, add risk weight 0.15.
  evidence_output: triggered_rules entry; 'account_age_lt_30d' category.
  condition:
    type: input
    field: behavioural_signals.account_age_days
    op: lt
    value: 30
  confidence_weight: 0.15
  reason_code: NEW_ACCOUNT
  description: Uploading account is less than 30 days old.
- rule_id: RULE_TAKEDOWN_HISTORY
  norm_refs:
  - DSA_14
  articles:
  - DSA Art 14
  obligation: Behavioural criteria used to restrict must be declared in T&Cs and applied
    objectively (DSA Art 14).
  control_objective: Prior enforcement history contributes transparently, never decisively.
  system_rule: If takedown_history >= 1, add risk weight 0.25.
  evidence_output: triggered_rules entry; 'prior_takedowns_present' category.
  condition:
    type: input
    field: behavioural_signals.takedown_history
    op: gte
    value: 1
  confidence_weight: 0.25
  reason_code: TAKEDOWN_HISTORY
  description: Account has one or more prior takedowns.
- rule_id: RULE_AI_DISCLOSURE_MISSING
  norm_refs:
  - AIACT_13
  - DSA_14
  articles:
  - AI Act Art 13
  - DSA Art 14
  obligation: Transparency about AI involvement; T&C disclosure duties applied objectively.
  control_objective: Undisclosed AI-generated content is a transparency defect, recorded
    as such.
  system_rule: If ai_generated is true and ai_disclosed is false, add risk weight
    0.20.
  evidence_output: triggered_rules entry; 'ai_generated_undisclosed' category.
  condition:
    type: input
    field: ai_generated_undisclosed
    op: eq
    value: true
  confidence_weight: 0.2
  reason_code: AI_DISCLOSURE_MISSING
  description: Track declared or detected as AI-generated without required disclosure.
- rule_id: RULE_STATEMENT_OF_REASONS
  norm_refs:
  - DSA_17
  articles:
  - DSA Art 17(1)
  - DSA Art 17(3)(a)
  - DSA Art 17(3)(b)
  - DSA Art 17(3)(c)
  - DSA Art 17(3)(f)
  obligation: Provide a clear and specific statement of reasons, disclosing automated
    means and redress.
  control_objective: Every decision emits a structured, automation-disclosing statement
    of reasons.
  system_rule: 'Always populate the statement-of-reasons block: action context, facts
    relied on (categories), automated_means=true, oversight pathway.'
  evidence_output: regulatory_mapping['DSA Art 17'] statement-of-reasons block; plain_english_explanation.
  condition:
    type: always
  confidence_weight: 0.0
  reason_code: STATEMENT_OF_REASONS_EMITTED
  description: Structured statement of reasons emitted per DSA Art 17.
  quality_check:
    specific_if: facts_relied_on has >= 2 named signal categories
    thin_if: facts_relied_on has < 2 named signal categories while concerns are identified
    note: A thin statement still satisfies 17(3)'s structural fields but may fail
      17(1)'s clear-and-specific standard. The engine flags this; it does not resolve
      it. (Boundary thesis.)
- rule_id: RULE_HUMAN_REVIEW_ROUTING
  norm_refs:
  - GDPR_22
  - AIACT_14
  - DSA_20
  articles:
  - GDPR Art 22
  - AI Act Art 14
  - DSA Art 20
  obligation: Human intervention for significant automated decisions; effective oversight;
    complaint decisions never solely automated.
  control_objective: Low-confidence or forced-review outcomes route to a named human
    pathway.
  system_rule: If band is Human-Review-Required or any triggered rule forces review,
    set human_review_required and reference the oversight pathway.
  evidence_output: human-review flag; oversight_pathway field.
  condition:
    type: outcome
    field: human_review_required
    op: eq
    value: true
  confidence_weight: 0.0
  reason_code: HUMAN_REVIEW_ROUTED
  description: Decision routed to human reviewer (GDPR Art 22 / AI Act Art 14 / DSA
    Art 20).
- rule_id: RULE_PROVENANCE_RECORD
  norm_refs:
  - GDPR_24
  - GDPR_5
  articles:
  - GDPR Art 24
  - GDPR Art 5(2)
  obligation: 'Demonstrate compliance: accountability requires reconstructable records.'
  control_objective: Every decision permanently records the policy version and is
    replayable.
  system_rule: Always stamp policy_version into the Evidence Pack and append the decision
    to the audit log.
  evidence_output: policy_version field; append-only audit log row.
  condition:
    type: always
  confidence_weight: 0.0
  reason_code: PROVENANCE_RECORDED
  description: Policy version and decision recorded for accountability (GDPR Arts
    5(2), 24).
required_signals:
- fingerprint_match_score
- ownership_claims
approval:
  approved_by: distributor-demo
  approved_at: '2026-08-22T00:00:00Z'
  role: controller sign-off (EDPB 07/2020 para 84; GDPR Art 28(3)(a))
