# policies/v0.1.0.yaml — Policy Translation Layer (POL-1..4)
#
# Every rule documents its full Norm-to-Control chain:
#   Norm -> Obligation -> Control Objective -> System Rule -> Evidence Output
# This chain IS the dissertation's original methodological contribution.
#
# Engine output semantics (DEC-1..4):
#   R = sum of confidence_weight over triggered risk rules (clamped to 1.0)
#   risk_direction = "concerns_identified" if R >= 0.5 else "no_concerns_identified"
#   confidence_score = |1 - 2R|  (confidence in the assessment, NOT a verdict)
#   band from thresholds below. No categorical Allow/Reject exists anywhere.

policy_version: "0.1.0"
effective_date: "2026-07-06"
description: "First full bundle: 9 rules over GDPR 5/22/24, AI Act 13/14, DSA 14/17/20."
oversight_pathway: "internal-complaint-v1"   # DSA Arts 17(3)(f), 20
retention_reference: "retention-policy-v1 (synthetic demo: indefinite)"

bands:            # inclusive lower bounds, evaluated high -> low
  high: 0.80
  medium: 0.50
  low: 0.20
  # below low -> Human-Review-Required

rules:
  # ── Risk rules (move the score) ──────────────────────────────────────────
  - rule_id: RULE_OWNERSHIP_CONFLICT
    norm_refs: [GDPR_22, DSA_17]
    articles: ["GDPR Art 22", "DSA Art 17(3)(b)"]
    obligation: "Contested ownership makes the decision significant for the affected artist; Art 22 safeguards and Art 17 facts-relied-on apply."
    control_objective: "Never let a contested-ownership submission pass on automation alone."
    system_rule: "If more than one ownership claimant is present, add risk weight 0.35 and force human review."
    evidence_output: "triggered_rules entry; human-review routing recorded; claimant count as category (no identities)."
    condition: { type: input, field: ownership_claims, op: count_gt, value: 1 }
    confidence_weight: 0.35
    forces_human_review: true
    reason_code: OWNERSHIP_CONFLICT
    description: "Conflicting ownership claims detected on submitted recording."

  - rule_id: RULE_FINGERPRINT_PARTIAL
    norm_refs: [DSA_17, DSA_14]
    articles: ["DSA Art 17(3)(b)", "DSA Art 14"]
    obligation: "Facts relied on must be recorded (17(3)(b)); T&C restrictions applied diligently and objectively (14)."
    control_objective: "Ambiguous fingerprint evidence must lower assessment confidence, not silently resolve."
    system_rule: "If 0.30 <= fingerprint_match_score < 0.75, add risk weight 0.25."
    evidence_output: "triggered_rules entry; 'fingerprint_match_partial' category in facts relied on."
    condition: { type: input, field: fingerprint_match_score, op: between, value: [0.30, 0.75] }
    confidence_weight: 0.25
    reason_code: FINGERPRINT_PARTIAL
    description: "Partial acoustic fingerprint match against an existing recording."

  - rule_id: RULE_FINGERPRINT_STRONG
    norm_refs: [DSA_17, DSA_14]
    articles: ["DSA Art 17(3)(b)", "DSA Art 14"]
    obligation: "Facts relied on must be recorded (17(3)(b)); a strong match is a fact that must be stated, not a verdict of infringement."
    control_objective: "Strong duplication evidence raises confident concern while remaining evidence, not adjudication."
    system_rule: "If fingerprint_match_score >= 0.75, add risk weight 0.55."
    evidence_output: "triggered_rules entry; 'fingerprint_match_strong' category in facts relied on."
    condition: { type: input, field: fingerprint_match_score, op: gte, value: 0.75 }
    confidence_weight: 0.55
    reason_code: FINGERPRINT_STRONG
    description: "Strong acoustic fingerprint match against an existing recording."

  - rule_id: RULE_NEW_ACCOUNT
    norm_refs: [DSA_14]
    articles: ["DSA Art 14"]
    obligation: "Behavioural criteria used to restrict must be declared in T&Cs and applied objectively."
    control_objective: "Account-age signal contributes transparently and proportionately, never decisively."
    system_rule: "If account_age_days < 30, add risk weight 0.15."
    evidence_output: "triggered_rules entry; 'account_age_lt_30d' category."
    condition: { type: input, field: behavioural_signals.account_age_days, op: lt, value: 30 }
    confidence_weight: 0.15
    reason_code: NEW_ACCOUNT
    description: "Uploading account is less than 30 days old."

  - rule_id: RULE_TAKEDOWN_HISTORY
    norm_refs: [DSA_14]
    articles: ["DSA Art 14"]
    obligation: "Behavioural criteria used to restrict must be declared in T&Cs and applied objectively (DSA Art 14)."
    control_objective: "Prior enforcement history contributes transparently, never decisively."
    system_rule: "If takedown_history >= 1, add risk weight 0.25."
    evidence_output: "triggered_rules entry; 'prior_takedowns_present' category."
    condition: { type: input, field: behavioural_signals.takedown_history, op: gte, value: 1 }
    confidence_weight: 0.25
    reason_code: TAKEDOWN_HISTORY
    description: "Account has one or more prior takedowns."

  - rule_id: RULE_AI_DISCLOSURE_MISSING
    norm_refs: [AIACT_13, DSA_14]
    articles: ["AI Act Art 13", "DSA Art 14"]
    obligation: "Transparency about AI involvement; T&C disclosure duties applied objectively."
    control_objective: "Undisclosed AI-generated content is a transparency defect, recorded as such."
    system_rule: "If ai_generated is true and ai_disclosed is false, add risk weight 0.20."
    evidence_output: "triggered_rules entry; 'ai_generated_undisclosed' category."
    condition: { type: input, field: ai_generated_undisclosed, op: eq, value: true }
    confidence_weight: 0.20
    reason_code: AI_DISCLOSURE_MISSING
    description: "Track declared or detected as AI-generated without required disclosure."

  # ── Disclosure rules (weight 0 — they shape the Evidence Pack) ───────────
  - rule_id: RULE_STATEMENT_OF_REASONS
    norm_refs: [DSA_17]
    articles: ["DSA Art 17(1)", "DSA Art 17(3)(a)", "DSA Art 17(3)(b)", "DSA Art 17(3)(c)", "DSA Art 17(3)(f)"]
    obligation: "Provide a clear and specific statement of reasons, disclosing automated means and redress."
    control_objective: "Every decision emits a structured, automation-disclosing statement of reasons."
    system_rule: "Always populate the statement-of-reasons block: action context, facts relied on (categories), automated_means=true, oversight pathway."
    evidence_output: "regulatory_mapping['DSA Art 17'] statement-of-reasons block; plain_english_explanation."
    condition: { type: always }
    confidence_weight: 0.0
    reason_code: STATEMENT_OF_REASONS_EMITTED
    description: "Structured statement of reasons emitted per DSA Art 17."
    quality_check:
      specific_if: "facts_relied_on has >= 2 named signal categories"
      thin_if: "facts_relied_on has < 2 named signal categories while concerns are identified"
      note: "A thin statement still satisfies 17(3)'s structural fields but may fail 17(1)'s clear-and-specific standard. The engine flags this; it does not resolve it. (Boundary thesis.)"

  - rule_id: RULE_HUMAN_REVIEW_ROUTING
    norm_refs: [GDPR_22, AIACT_14, DSA_20]
    articles: ["GDPR Art 22", "AI Act Art 14", "DSA Art 20"]
    obligation: "Human intervention for significant automated decisions; effective oversight; complaint decisions never solely automated."
    control_objective: "Low-confidence or forced-review outcomes route to a named human pathway."
    system_rule: "If band is Human-Review-Required or any triggered rule forces review, set human_review_required and reference the oversight pathway."
    evidence_output: "human-review flag; oversight_pathway field."
    condition: { type: outcome, field: human_review_required, op: eq, value: true }
    confidence_weight: 0.0
    reason_code: HUMAN_REVIEW_ROUTED
    description: "Decision routed to human reviewer (GDPR Art 22 / AI Act Art 14 / DSA Art 20)."

  - rule_id: RULE_PROVENANCE_RECORD
    norm_refs: [GDPR_24, GDPR_5]
    articles: ["GDPR Art 24", "GDPR Art 5(2)"]
    obligation: "Demonstrate compliance: accountability requires reconstructable records."
    control_objective: "Every decision permanently records the policy version and is replayable."
    system_rule: "Always stamp policy_version into the Evidence Pack and append the decision to the audit log."
    evidence_output: "policy_version field; append-only audit log row."
    condition: { type: always }
    confidence_weight: 0.0
    reason_code: PROVENANCE_RECORDED
    description: "Policy version and decision recorded for accountability (GDPR Arts 5(2), 24)."
