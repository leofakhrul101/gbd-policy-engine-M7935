[project]
name = "gbd-policy-engine"
version = "0.2.2"
description = "Governance-by-Design Policy Engine — academic demonstration artefact for M7935 (LLM Law, Technology & Innovation, University of Strathclyde)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.17",
]

[project.optional-dependencies]
demo = ["streamlit>=1.30"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
